<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ESL Games - Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .menu-container {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 30px;
    }

    .games-grid {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .game-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 15px;
      border: 2px solid transparent;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      border-color: #5cacee;
      background: white;
    }

    .game-card img {
      width: 160px;
      height: 160px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .game-card:nth-child(2) img {
      width: 200px;
      height: 200px;
    }

    .game-info {
      text-align: left;
      flex: 1;
    }

    .game-name {
      font-size: 1.3rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .game-part {
      font-size: 0.75rem;
      color: #5cacee;
      font-weight: 600;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .game-description {
      font-size: 0.85rem;
      color: #666;
      line-height: 1.4;
    }

    @media (max-width: 600px) {
      .menu-container {
        padding: 40px 25px;
      }

      h1 {
        font-size: 1.6rem;
        margin-bottom: 30px;
      }

      .game-card {
        flex-direction: column;
        text-align: center;
      }

      .game-info {
        text-align: center;
      }

      .game-card img {
        width: 200px;
        height: 200px;
      }

      .game-card:nth-child(2) img {
        width: 240px;
        height: 240px;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .game-card {
      animation: fadeIn 0.5s ease-out;
    }

    .game-card:nth-child(1) {
      animation-delay: 0.1s;
    }

    .game-card:nth-child(2) {
      animation-delay: 0.2s;
    }
  </style>
</head>
<body>
  <div class="menu-container">
    <h1>Choose Your Game</h1>
    
    <div class="games-grid">
      <!-- Cloze Cat Game -->
      <a href="clozecat.html" class="game-card">
        <img src="title.png" alt="Cloze Cat">
        <div class="game-info">
          <h2 class="game-name">Cloze Cat</h2>
          <p class="game-part">Part 2: Open Cloze</p>
          <p class="game-description">Fill in the missing words in sentences</p>
        </div>
      </a>

      <!-- TransformerCat B2 Game -->
      <a href="transformercat.html" class="game-card">
        <img src="TransformerCatb2.png" alt="TransformerCat B2">
        <div class="game-info">
          <h2 class="game-name">TransformerCat B2</h2>
          <p class="game-part">Part 4: Key Word Transformation</p>
          <p class="game-description">Transform sentences using key words</p>
        </div>
      </a>
    </div>
  </div>

  <script>
    // Add click sound effect
    const clickSound = new Audio('click.wav');
    clickSound.volume = 0.6;

    document.querySelectorAll('.game-card').forEach(card => {
      card.addEventListener('click', (e) => {
        clickSound.currentTime = 0;
        clickSound.play().catch(err => console.log('Sound play failed:', err));
      });

      // Add tap effect for mobile
      card.addEventListener('touchstart', () => {
        card.style.transform = 'scale(0.98)';
      });

      card.addEventListener('touchend', () => {
        card.style.transform = 'scale(1)';
      });
    });
  </script>
</body>
</html>
